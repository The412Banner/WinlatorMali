import java.net.URL
import java.nio.file.Files
import java.nio.file.Paths
import java.security.MessageDigest

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Adjust Gradle plugin versions if needed
        classpath 'com.android.tools.build:gradle:8.8.0'
        // Store port: bumped 1.9.0 -> 2.0.21 to match the Bannerlator store toolchain (Compose compiler
        // plugin needs Kotlin 2.0+). WinlatorMali has no .kt of its own yet, so the bump is low-risk.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'
    }

}

plugins {
    id 'com.android.application'
}
// Store port: applied the legacy way because Kotlin is wired via buildscript{} classpath, not the
// plugins{} version catalog (same structure Bannerlator uses).
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

tasks.register("downloadAssets") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    def files = [
        [name: "imagefs.tzst", url: "https://github.com/GunaCharanTeja/Winlator-Extras/releases/download/Sd/imagefs.tzst"],
        [name: "proton-10-arm64ec.tzst", url: "https://github.com/GunaCharanTeja/Winlator-Extras/releases/download/Sd/proton-10-arm64ec.tzst"],
        [name: "proton-9.0-arm64ec.tzst", url: "https://github.com/GunaCharanTeja/Winlator-Extras/releases/download/Sd/proton-9.0-arm64ec.tzst"],
        [name: "proton-9.0-x86_64.tzst", url: "https://github.com/GunaCharanTeja/Winlator-Extras/releases/download/Sd/proton-9.0-x86_64.tzst"]
    ]

    doLast {
        if (!assetDir.exists()) assetDir.mkdirs()
        files.each { fileInfo ->
            File dest = new File(assetDir, fileInfo.name)
            if (!dest.exists()) {
                int maxRetries = 3
                int attempt = 0
                boolean success = false
                while (attempt < maxRetries && !success) {
                    attempt++
                    try {
                        println("Downloading ${fileInfo.name} (Attempt ${attempt}/${maxRetries})...")
                        URL url = new URL(fileInfo.url)
                        HttpURLConnection conn = (HttpURLConnection) url.openConnection()
                        conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                        conn.setConnectTimeout(20000)
                        conn.setReadTimeout(60000)
                        
                        if (conn.getResponseCode() == 200) {
                            long expectedSize = conn.getContentLengthLong()
                            dest.withOutputStream { fos ->
                                conn.inputStream.withStream { is ->
                                    byte[] buffer = new byte[131072]
                                    int read
                                    long total = 0
                                    while ((read = is.read(buffer)) != -1) {
                                        fos.write(buffer, 0, read)
                                        total += read
                                    }
                                    if (expectedSize > 0 && total != expectedSize) {
                                        throw new IOException("Download corrupted for ${fileInfo.name}")
                                    }
                                }
                            }
                            success = true
                            println("Finished downloading ${fileInfo.name}")
                        } else {
                            throw new IOException("Server returned status ${conn.getResponseCode()}")
                        }
                    } catch (Exception e) {
                        println("Error: ${e.message}")
                        if (dest.exists()) dest.delete()
                        if (attempt >= maxRetries) throw new GradleException("Failed to download ${fileInfo.name}", e)
                        sleep(3000)
                    }
                }
            }
        }
    }
}

tasks.register("prepareKotlinBuildScriptModel"){}
preBuild.dependsOn(downloadAssets)

android {
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.winlator.cmod"
        minSdkVersion 26
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        versionCode 20
        versionName "1.0 Bionic"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Store port: Kotlin JVM target + Jetpack Compose (matches Bannerlator's store subsystem).
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }


    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            pickFirsts += 'assets/dexopt/baseline.prof'
            pickFirsts += 'assets/dexopt/baseline.profm'
        }
    }
}

